<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="style.css" />

    <script src="https://unpkg.com/axios@1.13.2/dist/axios.min.js"></script>
    <title>AI Filipino Poem Generator</title>
  </head>
  <body>
    <header>
      <h1>AI Filipino Poem Generator</h1>

          id="themeInput"

        />
        <button id="generateBtn">Generate Poem</button>
      </div>
    </main>

        >
        and
        <a href="https://ai-fil-generator.netlify.app/" target="_blank"
          >hosted on Netlify</a
        >
      </p>
    </footer>
    <script src="index.js"></script>
  </body>
</html>
